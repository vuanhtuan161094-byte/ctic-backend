name: CMP Step 18A Backend Hotspot Audit

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-backend-hotspot-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
      - name: Largest TypeScript source files
        shell: bash
        run: |
          echo '=== TOP_TS_FILES ==='
          find src -type f -name '*.ts' -printf '%s\t%p\n' | sort -nr | sed -n '1,40p'
      - name: Large service/controller/spec counts
        shell: bash
        run: |
          echo '=== FILE_COUNTS ==='
          printf 'services='; find src -type f -name '*.service.ts' | wc -l
          printf 'controllers='; find src -type f -name '*.controller.ts' | wc -l
          printf 'specs='; find src -type f -name '*.spec.ts' | wc -l
          printf 'ts_total='; find src -type f -name '*.ts' | wc -l
          echo '=== TS_BYTES ==='
          find src -type f -name '*.ts' -printf '%s\n' | awk '{s+=$1} END {print s}'
      - name: Legacy debt markers
        shell: bash
        run: |
          echo '=== DEBT_MARKERS ==='
          grep -RInE --include='*.ts' 'TODO|FIXME|HACK|LEGACY|legacy|deprecated|DEPRECATED' src | sed -n '1,120p' || true
          echo '=== DEBT_MARKER_COUNT ==='
          grep -RInE --include='*.ts' 'TODO|FIXME|HACK|LEGACY|legacy|deprecated|DEPRECATED' src | wc -l || true
      - name: Direct service construction hotspots
        shell: bash
        run: |
          echo '=== DIRECT_NEW_SERVICE ==='
          grep -RInE --include='*.ts' 'new [A-Za-z0-9_]+Service\(' src --exclude='*.spec.ts' | sed -n '1,120p' || true
          echo '=== DIRECT_NEW_SERVICE_COUNT ==='
          grep -RInE --include='*.ts' 'new [A-Za-z0-9_]+Service\(' src --exclude='*.spec.ts' | wc -l || true
      - name: Hotspot method and Prisma profiles
        shell: bash
        run: |
          files=(
            src/audit-documents/audit-documents.service.ts
            src/certification-projects/certification-projects.service.ts
            src/customer-portal/customer-portal.service.ts
            src/technical-reviews/technical-reviews.service.ts
            src/experts/experts.service.ts
          )
          for file in "${files[@]}"; do
            echo "=== PROFILE $file ==="
            printf 'lines='; wc -l < "$file"
            printf 'methods='; grep -Ec '^[[:space:]]+(private |public |protected )?(async )?[A-Za-z_][A-Za-z0-9_]*\(' "$file" || true
            echo '-- methods --'
            grep -nE '^[[:space:]]+(private |public |protected )?(async )?[A-Za-z_][A-Za-z0-9_]*\(' "$file" | sed -n '1,120p' || true
            echo '-- prisma models --'
            grep -oE 'this\.prisma\.[A-Za-z0-9_]+' "$file" | sort | uniq -c | sort -nr || true
            echo '-- injected/direct services --'
            grep -nE 'Service[,;)]|new [A-Za-z0-9_]+Service\(' "$file" | sed -n '1,80p' || true
          done
      - name: Source tests near largest hotspots
        shell: bash
        run: |
          echo '=== HOTSPOT_TESTS ==='
          for dir in audit-documents certification-projects customer-portal technical-reviews experts; do
            echo "-- $dir --"
            find "src/$dir" -maxdepth 1 -type f -name '*.spec.ts' -printf '%s\t%f\n' | sort -nr
          done
          echo '=== AUDIT_TEAM_FILES ==='
          find src/audit-team-appointments -maxdepth 1 -type f -printf '%s\t%f\n' | sort -nr
