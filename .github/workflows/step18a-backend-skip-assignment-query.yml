name: CMP Step 18A Backend Skip Assignment Query

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-backend-skip-assignment-query.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;user=sa;password=CmpCiPass123;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic optimization
        run: node scripts/step18a-skip-assignment-query.cjs
      - name: Require bounded optimization diff
        shell: bash
        run: |
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/experts/expert-resource-governance.service.ts src/experts/expert-resource-governance.spec.ts | sort)
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Prisma schema validation
        run: npm run prisma:validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build
        run: npm run build
      - name: Full backend regression
        run: npm test -- --runInBand
      - name: Commit verified optimization
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/experts/expert-resource-governance.service.ts src/experts/expert-resource-governance.spec.ts
          git diff --cached --check
          git commit -m "perf(step18a): skip unused resource assignment query"
          git push origin HEAD:feature/step18a-stabilization
