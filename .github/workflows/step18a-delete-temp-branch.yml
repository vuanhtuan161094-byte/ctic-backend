name: CMP Step 18A Delete Temp Branch

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-delete-temp-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete accidental temporary branch
        run: git push origin --delete tmp-never-use
