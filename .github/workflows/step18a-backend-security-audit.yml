name: CMP Step 18A Backend Security Refresh

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-backend-security-audit.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Apply bounded runtime dependency refresh
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['@nestjs/common'] = '^11.2.3';
          p.dependencies['@nestjs/core'] = '^11.2.3';
          p.dependencies['@nestjs/platform-express'] = '^11.2.3';
          p.dependencies['@nestjs/swagger'] = '^11.4.7';
          p.dependencies.multer = '^2.3.0';
          p.overrides = {
            ...(p.overrides || {}),
            '@nestjs/platform-express': {
              ...((p.overrides || {})['@nestjs/platform-express'] || {}),
              multer: '2.3.0'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only qs fast-uri hono @hono/node-server mysql2 valibot
          npm ci
      - name: Enforce bounded dependency result
        shell: bash
        run: |
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' package-lock.json package.json | sort)
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git diff --check
          node - <<'NODE'
          const lock = require('./package-lock.json');
          for (const name of ['node_modules/prisma','node_modules/@prisma/client','node_modules/@prisma/adapter-mssql']) {
            const version = lock.packages?.[name]?.version;
            if (version !== '7.8.0') throw new Error(`${name} changed from canonical 7.8.0 to ${version}`);
          }
          const platformMulter = lock.packages?.['node_modules/@nestjs/platform-express/node_modules/multer'];
          if (platformMulter) throw new Error('Nested vulnerable Multer copy remains under @nestjs/platform-express');
          if (lock.packages?.['node_modules/multer']?.version !== '2.3.0') throw new Error('Multer 2.3.0 not resolved');
          NODE
      - name: Enforce improved production audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const m = a.metadata?.vulnerabilities ?? {};
          console.log('PROD_AUDIT=' + JSON.stringify(m));
          if ((m.critical ?? 0) !== 0) throw new Error('Critical production vulnerability detected');
          if ((m.total ?? 999) > 7 || (m.high ?? 999) > 4) throw new Error('Production audit did not improve to accepted bounded residual');
          for (const fixed of ['multer','qs','fast-uri','@nestjs/core','@nestjs/platform-express','@nestjs/swagger']) {
            if (a.vulnerabilities?.[fixed]) throw new Error(`Expected ${fixed} vulnerability to be removed`);
          }
          NODE
      - name: Prisma and build gate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run build
      - name: Full regression
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: npm test -- --runInBand
      - name: Commit verified dependency refresh
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(step18a): refresh backend runtime dependencies"
          git push origin HEAD:feature/step18a-stabilization
