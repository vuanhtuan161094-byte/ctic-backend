name: CMP Step 18A Backend Security Audit

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-backend-security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Baseline production audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-before.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/prod-before.json', 'utf8'));
          console.log('BEFORE=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          NODE
      - name: Simulate same-major lock refresh
        shell: bash
        run: |
          npm update --package-lock-only @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/swagger multer @prisma/adapter-mssql @prisma/client prisma
          echo 'LOCK_DIFF_BEGIN'
          git diff --stat -- package-lock.json package.json
          git diff --name-only
          echo 'LOCK_DIFF_END'
          npm ci
      - name: Candidate versions
        shell: bash
        run: |
          npm ls @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/schedule @nestjs/swagger multer @prisma/adapter-mssql @prisma/client prisma --depth=0 || true
      - name: Candidate production audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/prod-after.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/prod-after.json', 'utf8'));
          console.log('AFTER=' + JSON.stringify(a.metadata?.vulnerabilities ?? {}));
          const rows = Object.entries(a.vulnerabilities ?? {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            via: Array.isArray(v.via) ? v.via.map(x => typeof x === 'string' ? x : x.name).filter(Boolean) : [],
            range: v.range,
            fixAvailable: v.fixAvailable,
          }));
          console.log('AFTER_VULNERABILITIES=' + JSON.stringify(rows));
          NODE
      - name: Candidate Prisma and build gate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run build
      - name: Candidate full regression
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: npm test -- --runInBand
