name: CMP Step 18A Backend Security Audit

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-backend-security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Baseline audit
        run: npm audit --omit=dev || true
      - name: Refresh app runtime packages in working tree
        shell: bash
        run: |
          npm update --package-lock-only @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/swagger
          npm install --package-lock-only --ignore-scripts --save multer@^2.3.0
          npm ci
      - name: Verify candidate versions
        shell: bash
        run: |
          npm ls @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/schedule @nestjs/swagger multer @prisma/adapter-mssql @prisma/client prisma --depth=0 || true
          git diff --stat -- package.json package-lock.json
          git diff --name-only
      - name: Candidate audit
        run: npm audit --omit=dev || true
      - name: Prisma and build gate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run build
      - name: Full regression
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
        run: npm test -- --runInBand
