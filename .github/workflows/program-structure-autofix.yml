name: CMP Program Authority Autofix

on:
  push:
    branches: ["feature/ux-fix-batch01"]
    paths: [".github/workflows/program-structure-autofix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ux-fix-batch01
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded patch
        run: |
          sed -i 's/    } as const;/    };/g' scripts/program-structure-autofix.py
          python scripts/program-structure-autofix.py
      - name: Verify backend
        run: |
          npm run prisma:validate
          npm run prisma:generate
          npm run build
          npm test -- --runInBand
      - name: Commit verified patch
        run: |
          git config user.name "cmp-automation"
          git config user.email "cmp-automation@users.noreply.github.com"
          git add src/master-data-configuration/operational-standard-policy.ts src/master-data-configuration/operational-standard-policy.spec.ts src/master-data-configuration/standard-edition-lifecycle.service.ts src/certification-applications/certification-applications.service.ts src/certification-applications/certification-applications-auto-code.spec.ts src/customer-portal/customer-portal.service.ts src/customer-portal/customer-portal.controller.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No backend patch needed"
          else
            git commit -m "fix: enforce operational standard authority"
            git push origin HEAD:feature/ux-fix-batch01
          fi
