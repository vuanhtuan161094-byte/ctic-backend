name: CMP Step 18A Extract Audit Document Query Context

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-extract-audit-document-query-context.yml
      - scripts/step18a-extract-audit-document-query-context.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=cmp_ci;integratedSecurity=true;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic query context extraction
        run: node scripts/step18a-extract-audit-document-query-context.cjs
      - name: Require bounded refactor diff
        shell: bash
        run: |
          changed=$(git status --porcelain | sed -E 's/^.. //' | sort)
          expected=$(printf '%s\n' \
            src/audit-documents/audit-document-query-context.service.spec.ts \
            src/audit-documents/audit-document-query-context.service.ts \
            src/audit-documents/audit-documents.module.ts \
            src/audit-documents/audit-documents.service.ts | sort)
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Prisma schema validation
        run: npm run prisma:validate
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build
        run: npm run build
      - name: Full backend regression
        run: npm test -- --runInBand
      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/audit-documents/audit-document-query-context.service.spec.ts \
            src/audit-documents/audit-document-query-context.service.ts \
            src/audit-documents/audit-documents.module.ts \
            src/audit-documents/audit-documents.service.ts
          git diff --cached --check
          git commit -m "refactor(step18a): extract audit document query context"
          git push origin HEAD:feature/step18a-stabilization
