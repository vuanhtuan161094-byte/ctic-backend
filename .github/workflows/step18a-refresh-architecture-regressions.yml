name: CMP Step 18A Refresh Architecture Regressions

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-refresh-architecture-regressions.yml
      - scripts/step18a-refresh-architecture-regressions.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic regression refresh
        run: node scripts/step18a-refresh-architecture-regressions.cjs
      - name: Require bounded diff
        shell: bash
        run: |
          changed=$(git status --porcelain | sed -E 's/^.. //' | sort)
          expected=$(printf '%s\n' \
            scripts/tests/pre-audit-documents-regression-patch35b.mjs \
            scripts/tests/schedule-manday-regression-patch33.mjs | sort)
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run architecture-independent schedule regression
        run: node scripts/tests/schedule-manday-regression-patch33.mjs
      - name: Verify F04 regression follows query context
        shell: bash
        run: |
          grep -q "const queryContext = read('src/audit-documents/audit-document-query-context.service.ts')" scripts/tests/pre-audit-documents-regression-patch35b.mjs
          grep -q "queryContext.includes(\"audit_type: 'project_team'\")" scripts/tests/pre-audit-documents-regression-patch35b.mjs
      - name: Commit verified regression refresh
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            scripts/tests/pre-audit-documents-regression-patch35b.mjs \
            scripts/tests/schedule-manday-regression-patch33.mjs
          git diff --cached --check
          git commit -m "test(step18a): follow extracted architecture in regressions"
          git push origin HEAD:feature/step18a-stabilization
